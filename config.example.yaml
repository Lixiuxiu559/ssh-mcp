# 相对路径以本配置所在目录为基准；${VAR} 引用环境变量，$$ 表示字面 $。
server:
  host: 127.0.0.1
  port: 8808
auth:
  database: data/service.db
  session_hours: 8
  cookie_secure: false  # HTTPS 网关部署设 true
  cookie_path: /       # 子路径部署建议设 /ssh-mcp/
audit:
  path: audit/audit.db
  retention_days: 30
limits:
  default_command_timeout_seconds: 60
  max_command_timeout_seconds: 600
  max_output_bytes: 65536
  max_read_file_bytes: 1048576
  max_upload_bytes: 2097152
  max_download_bytes: 10485760
  max_list_entries: 500
  max_sessions_per_server: 8
servers: []
# 可在网页上新增服务器，或按下方示例配置：
# servers:
#   - alias: web-1
#     host: 10.0.0.11
#     port: 22
#     username: deploy
#     description: 应用服务器
#     tags: [prod]
#     known_hosts: keys/known_hosts
#     credential:
#       type: password
#       password: ${EXAMPLE_SSH_PASSWORD}
# 私钥文件凭据：{type: private_key_file, path: keys/web-1.pem}
# 可选 passphrase: ${EXAMPLE_KEY_PASSPHRASE}
