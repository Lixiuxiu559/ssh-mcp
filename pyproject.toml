[project]
name = "ssh-mcp"
version = "0.1.3"
description = "团队共享 SSH 网关 MCP 服务：集中管理服务器凭据，agent 只说机器名即可操作"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=4.0.3,<5",
    # [bcrypt]：支持带口令的 OpenSSH 新格式私钥（无 bcrypt 时仅传统 PEM 口令私钥可用）
    "asyncssh[bcrypt]>=2.17,<3",
    "pyyaml>=6.0.1",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
]

[project.scripts]
ssh-mcp = "ssh_mcp.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=1.0",
    "httpx2>=2.5.0",
    "ruff>=0.12",
]

[build-system]
requires = ["uv_build>=0.8,<0.12"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# B008: fastmcp 依赖注入的官方写法就是参数默认值调用（Depends(...)/CurrentContext()）
ignore = ["B008"]
